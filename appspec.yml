version: 0.0
os: linux
file_exists_behavior: OVERWRITE
files:
  - source: /
    destination: /home/ec2-user/app
hooks:
  ApplicationStop:
    - location: scripts/stop_container.sh
      timeout: 120
      runas: root
  AfterInstall:
    - location: scripts/build_image.sh
      timeout: 600
      runas: root
  ApplicationStart:
    - location: scripts/start_container.sh
      timeout: 120
      runas: root
